name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find uploaded ZIP file
        id: findzip
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "لا يوجد أي ملف ZIP في المستودع"
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_OUTPUT
          echo "تم العثور على ملف ZIP: $ZIP_FILE"

      - name: Unzip uploaded project
        run: unzip -o "${{ steps.findzip.outputs.ZIP_FILE }}" -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: cd project && gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChargeSpeedApp-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
